<!doctype html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Codzienna Niespodzianka</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="style.css?v=20261125n" />
</head>
<body>
  <div class="wrap">
    <main class="surface">
      <header class="top">
        <div class="brand"><span class="brand-mark" aria-hidden="true">✳</span> Codzienna niespodzianka</div>
        <div class="evening"><span id="period-icon" aria-hidden="true">🌇</span><span id="period-badge">Dobry wieczór</span></div>
      </header>
      <div class="layout">
        <section class="intro">
          <h1><span id="greeting-first">Miłego</span><br><em id="greeting-last">wieczoru.</em></h1>
          <p id="today" class="date"></p>
          <div class="occasion" aria-live="polite">
            <p class="caption">Dziś obchodzimy</p>
            <p id="holiday">Sprawdzam, jakie jest dziś święto...</p>
          </div>
          <form id="search-form" class="search" role="search" aria-label="Wyszukiwarka">
            <input id="search-input" type="search" aria-label="Wyszukiwarka" placeholder="Szukaj w Google lub wpisz adres" autocomplete="off" autofocus />
            <button type="submit">Szukaj</button>
          </form>
        </section>
        <section class="visual" aria-label="Obrazek dnia">
          <div class="visual-top"><div id="period-caption" class="visual-meta">Dla spokojnego wieczoru</div></div>
          <div class="frame"><img id="greeting-image" alt="Laurka dnia" /></div>
          <div class="visual-bottom"><button id="next-btn" class="next" type="button">Losuj</button></div>
        </section>
      </div>
    </main>
  </div>
  <script src="data.js?v=20261125h"></script>
  <script src="holidays-data.js?v=20261125hc"></script>
  <script src="script.js?v=20261125l"></script>
</body>
</html>
